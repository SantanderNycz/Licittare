<section class="principles-section" aria-labelledby="principles-title">
  <div class="container">
    <div class="section-header">
      <h2 class="section-title" id="principles-title">Os Nossos Princípios</h2>
      <p class="section-subtitle">
        Confiança, transparência e valor. Estes princípios orientam tudo o que fazemos
      </p>
    </div>

    <div class="principles-grid">
      @for (p of principles; track p.title) {
      <article class="principle-card">
        <div class="principle-icon" aria-hidden="true">
          <fa-icon [icon]="p.icon" class="p-icon"></fa-icon>
        </div>
        <h3 class="principle-title">{{ p.title }}</h3>
        <p class="principle-desc">{{ p.description }}</p>
      </article>
      }
    </div>
  </div>
</section>
